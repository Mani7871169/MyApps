<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tablet Purchase Checklist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f7f9fc;
      color: #333;
    }

    h1 {
      color: #004080;
      margin-bottom: 10px;
    }

    ul {
      list-style: none;
      padding-left: 0;
    }

    li {
      margin: 12px 0;
      background: #fff;
      padding: 12px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    label {
      cursor: pointer;
    }

    input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    .section {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1> Tablet Purchase Checklist</h1>

  <ul>
    <li><label><input type="checkbox"> <strong>Model & Variant:</strong> Confirm exact model (e.g., <em>Galaxy Tab A7 Lite 4G</em> or <em>Tab A9 LTE</em>) and RAM/storage (3 GB / 32 GB or 4 GB / 64 GB).</label></li>
    
    <li><label><input type="checkbox"> <strong>LTE Support:</strong> Ensure the tablet has LTE/4G support and a SIM card slot.</label></li>
    
    <li><label><input type="checkbox"> <strong>Voice Calling:</strong> Verify that it supports VoLTE or regular calling (some LTE tablets don’t allow direct calling).</label></li>
    
    <li><label><input type="checkbox"> <strong>Display:</strong> At least 8.7″ screen with HD+ resolution.</label></li>
    
    <li><label><input type="checkbox"> <strong>Processor & RAM:</strong> Look for MediaTek Helio G99 or MT8768T, and a minimum of 3 GB RAM.</label></li>
    
    <li><label><input type="checkbox"> <strong>Battery:</strong> Should be at least 5000 mAh for good usage time.</label></li>
    
    <li><label><input type="checkbox"> <strong>Charger & Cable:</strong> Ensure it includes a fast charger and USB-C cable.</label></li>
    
    <li><label><input type="checkbox"> <strong>Manual & Warranty Card:</strong> Should be sealed and official.</label></li>
    
    <li><label><input type="checkbox"> <strong>Android Version:</strong> Preferably Android 13 or newer.</label></li>
    
    <li><label><input type="checkbox"> <strong>Samsung UI Version:</strong> Should have One UI Core or similar.</label></li>
    
    <li><label><input type="checkbox"> <strong>Check Display & Sound:</strong> Play a video, test brightness, speakers, and touchscreen.</label></li>
    
    <li><label><input type="checkbox"> <strong>SIM Slot & Network:</strong> Insert a SIM and check if it connects to 4G properly.</label></li>
    
    <li><label><input type="checkbox"> <strong>Camera Test:</strong> Try both front and back cameras for clarity.</label></li>
    
    <li><label><input type="checkbox"> <strong>Price:</strong> Should be under ₹16,000 (watch for festive discounts).</label></li>
    
    <li><label><input type="checkbox"> <strong>Warranty:</strong> Confirm 1-year Samsung warranty.</label></li>
    
    <li><label><input type="checkbox"> <strong>Invoice:</strong> Get a GST bill, especially for warranty and return claims.</label></li>
  </ul>

</body>
</html>
